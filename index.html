<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1a1033" />
<title>흔들어! 포춘쿠키 🥠</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: radial-gradient(circle at 30% 20%, #3b1f6b 0%, #1a1033 60%, #0a0518 100%);
    color: #fff; overflow: hidden; user-select: none;
  }
  #app {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    padding: 32px 24px; text-align: center;
  }
  h1 { font-size: 22px; margin: 0; font-weight: 600; letter-spacing: -0.5px; opacity: 0.9; }
  .cookie {
    font-size: 140px; line-height: 1;
    filter: drop-shadow(0 10px 30px rgba(255, 200, 100, 0.4));
    transition: transform 0.15s ease;
  }
  .cookie.shake { animation: shake 0.5s ease; }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    20% { transform: translate(-12px, -4px) rotate(-8deg); }
    40% { transform: translate(10px, 6px) rotate(7deg); }
    60% { transform: translate(-8px, 4px) rotate(-5deg); }
    80% { transform: translate(6px, -6px) rotate(4deg); }
  }
  .fortune {
    min-height: 90px; padding: 20px 22px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 18px;
    font-size: 18px; line-height: 1.55;
    backdrop-filter: blur(10px);
    width: 100%; max-width: 420px;
    display: flex; align-items: center; justify-content: center;
  }
  .hint { font-size: 14px; opacity: 0.6; }
  button {
    background: linear-gradient(135deg, #ff9a56 0%, #ff5e7e 100%);
    color: #fff; border: none; padding: 14px 28px;
    border-radius: 999px; font-size: 16px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(255, 94, 126, 0.4);
    cursor: pointer; width: 100%; max-width: 420px;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; box-shadow: none; }
  .row { display: flex; gap: 10px; width: 100%; max-width: 420px; }
  .row button { flex: 1; padding: 12px; font-size: 14px; }
  .secondary {
    background: rgba(255, 255, 255, 0.1) !important;
    box-shadow: none !important;
  }
  .status { font-size: 12px; opacity: 0.5; min-height: 16px; }
</style>
</head>
<body>
<div id="app">
  <h1>흔들어! 포춘쿠키 🥠</h1>
  <div class="cookie" id="cookie">🥠</div>
  <div class="fortune" id="fortune">핸드폰을 흔들면 오늘의 운세가 나옵니다 ✨</div>
  <div style="width:100%; display:flex; flex-direction:column; gap:12px; align-items:center;">
    <div class="hint" id="hint">아래 버튼을 눌러 시작하세요</div>
    <button id="startBtn">🔔 알림 허용하고 시작하기</button>
    <div class="row" style="display:none;" id="controls">
      <button class="secondary" id="manualBtn">🥠 한 번 뽑기</button>
      <button class="secondary" id="stopBtn">⏸ 중지</button>
    </div>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
const FORTUNES = [
  "오늘은 예상치 못한 행운이 당신을 찾아옵니다 🍀",
  "잠시 멈춰 심호흡을. 좋은 일이 다가오고 있어요.",
  "오래 미뤄둔 그 일, 오늘 시작하면 술술 풀립니다.",
  "당신의 미소가 누군가의 하루를 구합니다 😊",
  "작은 친절이 큰 보답이 되어 돌아옵니다.",
  "오늘 만나는 사람과의 대화에 힌트가 있습니다.",
  "지갑보다 마음을 채우는 하루가 되길 ✨",
  "고민하던 선택, 직감을 믿어도 좋습니다.",
  "재물운 상승 중! 작은 투자가 좋은 결과로.",
  "오늘은 '쉼표'가 필요한 날. 무리하지 마세요.",
  "사랑은 가까운 곳에 있습니다. 둘러보세요 💝",
  "지금의 노력은 3개월 뒤 빛을 발합니다.",
  "오늘 먹는 음식이 운을 부릅니다. 잘 챙겨드세요 🍱",
  "예상치 못한 연락에 좋은 소식이 담겨있어요 📩",
  "당신은 생각보다 훨씬 강한 사람입니다.",
  "오늘의 행운 색: 노란색 💛",
  "별일 아닌 것에 웃는 하루, 그게 행복입니다.",
  "타이밍이 맞아떨어지는 하루가 될 거예요 ⏰",
  "오래된 친구에게 안부 인사를 건네보세요.",
  "당신의 아이디어, 지금 꺼내야 할 때입니다 💡",
  "오늘은 '아니오'라고 말할 용기를 가져보세요.",
  "예술이나 음악과 가까이 하면 영감이 찾아옵니다 🎵",
  "사소한 정리정돈이 큰 변화를 만듭니다.",
  "오늘의 행운 숫자: 7 🎲",
  "한 걸음만 더. 거의 다 왔습니다 🚶",
  "당신을 진심으로 응원하는 사람이 곁에 있어요.",
  "물 한 잔이 오늘의 컨디션을 좌우합니다 💧",
  "웃음은 최고의 화장품. 오늘 많이 웃으세요!",
  "지나간 일에 미련 NO. 새로운 챕터가 열립니다 📖",
  "오늘 본 풍경이 오래 기억에 남을 거예요 🌅"
];

let lastShake = 0;
let listening = false;
let motionHandler = null;

function pick() {
  return FORTUNES[Math.floor(Math.random() * FORTUNES.length)];
}

function showFortune(text) {
  const el = document.getElementById("fortune");
  el.style.opacity = "0";
  setTimeout(() => {
    el.textContent = text;
    el.style.transition = "opacity 0.4s";
    el.style.opacity = "1";
  }, 180);
  const cookie = document.getElementById("cookie");
  cookie.classList.remove("shake");
  void cookie.offsetWidth;
  cookie.classList.add("shake");
  if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
}

function notify(text) {
  if (!("Notification" in window)) return;
  if (Notification.permission !== "granted") return;
  try {
    new Notification("🥠 오늘의 포춘쿠키", {
      body: text,
      icon: "icon-192.png",
      badge: "icon-192.png",
      vibrate: [40, 60, 40],
      tag: "fortune"
    });
  } catch (e) {}
}

function fire() {
  const now = Date.now();
  if (now - lastShake < 2500) return;
  lastShake = now;
  const text = pick();
  showFortune(text);
  notify(text);
}

function startMotion() {
  motionHandler = (e) => {
    const a = e.accelerationIncludingGravity || e.acceleration;
    if (!a) return;
    const force = Math.sqrt((a.x||0)**2 + (a.y||0)**2 + (a.z||0)**2);
    if (force > 25) fire();
  };
  window.addEventListener("devicemotion", motionHandler);
  listening = true;
  setStatus("흔들기 감지 중… 핸드폰을 흔들어보세요!");
}

function stopMotion() {
  if (motionHandler) window.removeEventListener("devicemotion", motionHandler);
  listening = false;
  setStatus("중지됨");
}

function setStatus(msg) {
  document.getElementById("status").textContent = msg;
}

async function start() {
  const btn = document.getElementById("startBtn");
  btn.disabled = true;
  try {
    if ("Notification" in window && Notification.permission === "default") {
      await Notification.requestPermission();
    }
    if (typeof DeviceMotionEvent !== "undefined" &&
        typeof DeviceMotionEvent.requestPermission === "function") {
      const res = await DeviceMotionEvent.requestPermission();
      if (res !== "granted") {
        setStatus("모션 권한이 거부되었습니다");
        btn.disabled = false;
        return;
      }
    }
    startMotion();
    btn.style.display = "none";
    document.getElementById("hint").style.display = "none";
    document.getElementById("controls").style.display = "flex";
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    }
  } catch (e) {
    setStatus("오류: " + e.message);
    btn.disabled = false;
  }
}

document.getElementById("startBtn").addEventListener("click", start);
document.getElementById("manualBtn").addEventListener("click", () => {
  lastShake = 0; fire();
});
document.getElementById("stopBtn").addEventListener("click", () => {
  if (listening) { stopMotion(); document.getElementById("stopBtn").textContent = "▶ 재개"; }
  else { startMotion(); document.getElementById("stopBtn").textContent = "⏸ 중지"; }
});
</script>
</body>
</html>
